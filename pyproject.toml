[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "deceptionguard"
version = "0.0.1"
description = "Offline-first email phishing/deception analysis with grounded intent graphs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Swayam Swaroop Sahu"},
]
keywords = ["phishing", "email", "security", "intent-graph", "deception"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
# Zero third-party dependencies in core
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
dg = "deceptionguard.cli.main:main"

[project.urls]
Homepage = "https://github.com/Swayam-Swaroop-Sahu/DeceptionGuard"
Repository = "https://github.com/Swayam-Swaroop-Sahu/DeceptionGuard"
Issues = "https://github.com/Swayam-Swaroop-Sahu/DeceptionGuard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B905", "SIM103", "E741", "SIM102"]
